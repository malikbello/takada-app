# Clinic hub: one command on the clinic laptop or mini-PC (ADR-0023 §3).
#   cp deploy/compose/hub.env.example deploy/compose/hub.env   # then edit the secrets
#   docker compose -f deploy/compose/hub.yml --env-file deploy/compose/hub.env up -d
# Phones on the clinic Wi-Fi open https://<hub-name>.local and pair with a code from:
#   docker compose -f deploy/compose/hub.yml exec takada node -e "..."  (see docs/operations.md)
name: takada-hub

services:
  takada:
    build: { context: ../.., dockerfile: deploy/server.Dockerfile }
    image: takada-server:local
    restart: unless-stopped
    environment:
      ROLE: hub
      NODE_NAME: ${HUB_NAME:-hub-1}
      ADMIN_TOKEN: ${ADMIN_TOKEN:?set ADMIN_TOKEN in hub.env}
      PHC_SCRIBE_URL: http://scribe:8000
      PHC_SCRIBE_API_KEY: ${PHC_SCRIBE_API_KEY:?set PHC_SCRIBE_API_KEY in hub.env}
      WORKERS: ${WORKERS:-1}
      # The Android and iPhone apps run at https://localhost and capacitor://localhost
      # (apps/mobile/capacitor.config.ts), a different origin from the hub, so the hub must
      # allow them; the web app, served by the hub itself, needs nothing.
      CORS_ORIGINS: ${CORS_ORIGINS:-https://localhost,capacitor://localhost}
      # Recordings and full transcripts are deleted after these days (phc-scribe ADR-0033).
      RETAIN_AUDIO_DAYS: ${RETAIN_AUDIO_DAYS:-7}
      RETAIN_UNCONFIRMED_DAYS: ${RETAIN_UNCONFIRMED_DAYS:-30}
    volumes: [takada-data:/data]
    depends_on: [scribe]
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]

  # The phc-scribe /v1 API with the offline model (llama.cpp) and N-ATLaS ASR.
  scribe:
    image: ${PHC_SCRIBE_IMAGE:-phc-scribe-api:local}
    restart: unless-stopped
    environment:
      PHC_API_KEY_HASHES: ${PHC_SCRIBE_KEY_HASH:?set PHC_SCRIBE_KEY_HASH in hub.env}
      PHC_EXTRACTOR: ${PHC_EXTRACTOR:-keyword}
      PHC_LLAMACPP_URL: http://llm:8080
      # A draft on a 4-core laptop CPU takes 2-5 minutes, and a long visit (about 2,000 input
      # and 400 output tokens) can approach 10; with little free memory one took 12.9 (12 Oct).
      # phc-scribe's 600 s default cancelled such drafts, and each of the 3 attempts started over.
      # 840 s stays inside the hub's own 900 s wait for phc-scribe.
      PHC_LLAMACPP_TIMEOUT: ${PHC_LLAMACPP_TIMEOUT:-840}
      PHC_ASR: ${PHC_ASR:-off}
      PHC_ASR_MODELS: ${PHC_ASR_MODELS:-}
      # With PHC_ASR=ct2: the int8 speech folders, one model at a time as each passes its
      # checks (phc-scribe ADR-0032); every other language keeps its fp32 model above.
      PHC_ASR_INT8_MODELS: ${PHC_ASR_INT8_MODELS:-}
      # Never reach the internet for models: everything comes from the models volume.
      HF_HUB_OFFLINE: "1"
      HF_HOME: /models/hf
    volumes: [models:/models]
    security_opt: ["no-new-privileges:true"]

  # The fine-tuned N-ATLaS (GGUF) on the CPU. Enable with --profile model once the
  # model file is in the `models` volume; until then the scribe uses its keyword extractor.
  # Built from the llama.cpp release the model was evaluated with (deploy/llm.Dockerfile),
  # and served with the evaluation's settings (phc-scribe deploy/modal_gguf.py): the chat
  # template from the GGUF (--jinja) and an 8,192-token context. Same build, same settings,
  # same results as the benchmark.
  llm:
    profiles: [model]
    build: { context: .., dockerfile: llm.Dockerfile }
    image: takada-llm:b11387
    restart: unless-stopped
    # --parallel 1: one draft at a time gets every core (the hub's queue feeds it serially);
    # with several slots, a request the API had given up on kept competing for the CPU.
    command: ["-m", "/models/takada-anc.gguf", "--host", "0.0.0.0", "--port", "8080",
              "-c", "8192", "--jinja", "--no-webui", "--parallel", "1"]
    volumes: [models:/models:ro]
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]

  # HTTPS on the clinic network: phones need a secure origin for the microphone and the
  # offline app (service worker). Caddy issues the hub's certificate from its own CA;
  # each phone trusts that CA once at enrolment (docs/operations.md).
  proxy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports: ["443:443", "80:80"]
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
    environment:
      HUB_HOSTNAME: ${HUB_HOSTNAME:-takada-hub.local}
    volumes: [caddy-data:/data, ./Caddyfile:/etc/caddy/Caddyfile:ro]
    depends_on: [takada]

volumes:
  takada-data:
  models:
  caddy-data:
