# Never commit real values. Create with:
#   kubectl -n takada create secret generic takada-secrets \
#     --from-literal=ADMIN_TOKEN="$(openssl rand -base64 32)" --from-literal=PHC_SCRIBE_API_KEY=...
apiVersion: v1
kind: Secret
metadata: { name: takada-secrets, namespace: takada }
type: Opaque
stringData:
  ADMIN_TOKEN: replace-me
  PHC_SCRIBE_API_KEY: replace-me
