name: native

# Android and iPhone apps around the web build (ADR-0027). Runs only when the app or the
# native projects change: macOS minutes count 10x against the free quota on a private repo.
on:
  push:
    branches: [main]
    paths: ["apps/mobile/**", "packages/**", "pnpm-lock.yaml", ".github/workflows/native.yml"]
  pull_request:
    paths: ["apps/mobile/**", "packages/**", "pnpm-lock.yaml", ".github/workflows/native.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: pnpm install --frozen-lockfile
      - name: Build the web app and copy it into the Android project
        working-directory: apps/mobile
        run: pnpm build && npx cap sync android
      - name: Build the debug APK
        working-directory: apps/mobile/android
        run: ./gradlew --no-daemon assembleDebug
      - name: Check the APK (permissions, no backup, no cleartext)
        working-directory: apps/mobile/android
        run: |
          AAPT2=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)aapt2
          APK=app/build/outputs/apk/debug/app-debug.apk
          perms=$("$AAPT2" dump permissions "$APK" | grep -o "name='[^']*'" | sort)
          echo "$perms"
          echo "$perms" | grep -q RECORD_AUDIO
          if echo "$perms" | grep -qE "CAMERA|LOCATION|READ_CONTACTS|READ_EXTERNAL_STORAGE"; then echo "unexpected permission"; exit 1; fi
          manifest=$("$AAPT2" dump xmltree --file AndroidManifest.xml "$APK")
          echo "$manifest" | grep -q "allowBackup(0x01010280)=false"
          echo "$manifest" | grep -q "usesCleartextTraffic(0x010104ec)=false"
          if unzip -l "$APK" | grep -q "\.map$"; then echo "source maps in the APK"; exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: takada-android-debug
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

  ios:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build the web app and copy it into the iOS project
        working-directory: apps/mobile
        run: pnpm build && npx cap sync ios
      - name: Build for the simulator (no signing; proves the project compiles)
        working-directory: apps/mobile/ios/App
        run: |
          xcodebuild -version
          xcodebuild -project App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO build | tail -n 40   # the runner's bash sets pipefail
