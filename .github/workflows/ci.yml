name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm -r test
      - run: pnpm -r build

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm audit --prod --audit-level high

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build the server image (hub and cloud)
        run: docker build -f deploy/server.Dockerfile -t takada-server:ci .
      - name: Smoke test the image
        run: |
          docker run -d --name t -e ADMIN_TOKEN=ci-admin-token-0123456789abcdef -p 8080:8080 takada-server:ci
          for i in $(seq 1 30); do curl -fsS localhost:8080/healthz && break; sleep 1; done
          curl -fsS localhost:8080/readyz
          curl -fsS localhost:8080/ | grep -q "<title>"
      - name: Scan the image for vulnerabilities (Trivy, pinned image)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.75.0 \
            image --exit-code 1 --severity CRITICAL,HIGH --ignore-unfixed --no-progress takada-server:ci

  kubernetes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate manifests against the Kubernetes schema
        run: |
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz | tar xz
          ./kubeconform -strict -summary -kubernetes-version 1.31.0 deploy/k8s/takada.yaml
      - name: Validate the Compose file
        run: cp deploy/compose/hub.env.example deploy/compose/hub.env && sed -i 's/=$/=ci-placeholder-value-0123456789/' deploy/compose/hub.env && docker compose -f deploy/compose/hub.yml --env-file deploy/compose/hub.env config -q

